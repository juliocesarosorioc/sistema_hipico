<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Bancos y Tesorería - Club del Dinero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>if (!localStorage.getItem('club_sesion_activa')) window.location.href = 'index.html';</script>
</head>
<body class="bg-slate-50 font-sans text-sm h-screen flex flex-col overflow-x-hidden">

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="bg-white border-b border-slate-300 p-2 flex flex-wrap gap-2 items-center shadow-sm">
        <a href="dashboard.html" class="bg-slate-500 text-white px-3 py-1 rounded hover:bg-slate-600 transition shadow-sm text-xs font-bold">
            <i class="fas fa-arrow-left"></i> Panel
        </a>
        <a href="clientes.html" class="bg-cyan-500 text-white px-3 py-1 rounded shadow-sm hover:bg-cyan-600 text-xs font-bold">Clientes</a>
        <a href="depositos.html" class="bg-emerald-600 text-white px-3 py-1 rounded shadow-sm hover:bg-emerald-700 text-xs font-bold">Depósitos</a>
        <a href="caja.html" class="bg-orange-600 text-white px-3 py-1 rounded shadow-sm hover:bg-orange-700 text-xs font-bold">Caja Unificada</a>
        <span class="bg-white border border-slate-300 text-slate-700 px-3 py-1 rounded shadow-sm font-bold text-xs"><i class="fas fa-university text-blue-500"></i> Bancos Reales</span>
    </header>

    <main class="p-6 flex-1 overflow-y-auto max-w-7xl mx-auto w-full">
        
        <h1 class="text-2xl font-bold text-slate-800 mb-6 uppercase tracking-wide"><i class="fas fa-vault text-slate-400 mr-2"></i> Tesorería y Cuentas Bancarias</h1>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200 mb-6">
            <form id="formBanco" class="flex flex-wrap items-end gap-4">
                <div class="flex-1 min-w-[200px]">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nombre de la Cuenta / Banco</label>
                    <input type="text" id="nombreBanco" placeholder="Ej: Zelle Empresa, Pago Móvil Banesco..." class="w-full border border-slate-300 rounded px-3 py-2 text-sm outline-none focus:border-blue-500 uppercase" required>
                </div>
                
                <div class="w-64">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Moneda Operativa</label>
                    <select id="monedaBanco" class="w-full border border-slate-300 rounded px-3 py-2 text-sm outline-none focus:border-blue-500 font-bold text-slate-700" required>
                        <option value="">Cargando monedas...</option>
                    </select>
                </div>

                <div class="w-40">
                    <label class="block text-xs font-bold text-slate-700 mb-1">Saldo Inicial</label>
                    <input type="number" id="saldoInicial" step="0.01" value="0.00" class="w-full border border-slate-300 rounded px-3 py-2 text-sm outline-none focus:border-blue-500 font-mono font-bold text-right" required>
                </div>

                <button type="submit" id="btnGuardarBanco" class="bg-slate-800 text-white px-6 py-2 rounded shadow hover:bg-black font-bold transition-colors">
                    Añadir Banco
                </button>
            </form>
        </div>

        <!-- TABLA DE BANCOS REGISTRADOS -->
        <div class="mb-3 flex flex-wrap justify-between items-end gap-4">
            <h2 class="text-sm font-bold text-slate-600 uppercase">Cuentas Registradas</h2>
            <div class="relative w-full md:w-80">
                <i class="fas fa-search absolute left-3 top-2 text-slate-400"></i>
                <input type="text" id="buscadorBancos" placeholder="Buscar banco o moneda..." class="w-full border border-slate-300 rounded pl-9 pr-4 py-1.5 text-sm outline-none focus:border-blue-500">
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden mb-4">
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left" id="tablaBancos">
                    <thead class="bg-slate-900 text-white">
                        <tr>
                            <th class="p-3">Nombre Cuenta</th>
                            <th class="p-3">Moneda</th>
                            <th class="p-3 text-right">Saldo Local</th>
                            <th class="p-3 text-right">Tasa Actual</th>
                            <th class="p-3 text-right text-emerald-400 font-bold">Equivalencia USD</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaBancos" class="divide-y divide-slate-200 bg-white text-slate-700">
                        <tr><td colspan="6" class="p-6 text-center text-slate-500">Conectando a la base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-between items-center bg-slate-100 p-4 rounded border border-slate-200">
            <button id="btnEliminarTodos" class="border border-red-300 text-red-500 hover:bg-red-50 font-bold px-4 py-2 rounded text-xs transition-colors">
                <i class="fas fa-trash-alt mr-1"></i> Borrar Todo el Directorio
            </button>
            <div class="text-right">
                <p class="text-xs font-bold text-slate-500 uppercase">Total Liquidez en Tesorería</p>
                <p class="text-2xl font-black text-slate-800" id="granTotalUSD">$0.00</p>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/conexion.js"></script>
    <script src="js/bancos.js"></script>
</body>
</html>
