<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Hípico IA v4 — Retiros Vinculados, Pesos En Vivo & Michel Godet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --sh-bg: #070b14; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; font-family: system-ui, -apple-system, sans-serif; background: var(--sh-bg); color: #f1f5f9; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .glass { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(51, 65, 85, 0.75); border-radius: 14px; }
    .pizarra-led { background: radial-gradient(circle at 50% 15%, #111c35 0%, #04070e 100%); border: 2px solid #f59e0b; border-radius: 16px; }
    .track-dirt { background: repeating-linear-gradient(90deg, #2c1d11, #2c1d11 45px, #3d2817 45px, #3d2817 90px); border: 2px solid #b45309; border-radius: 12px; position: relative; overflow: hidden; }
    input, select { background: #090d16; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="max-w-[1600px] mx-auto glass p-5 space-y-5">
    
    <!-- CABECERA -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <div>
        <span id="topStatusBadge" class="px-2.5 py-1 text-[11px] font-bold uppercase bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-full mono">
          MACTOR + SMIC + ACTUARIO: RETIROS VINCULADOS EN VIVO
        </span>
        <h1 class="text-xl md:text-2xl font-extrabold text-white mt-1">
          Pizarra Prospectiva con Vinculación de Retiros, Pesos en Vivo y Tren de Carrera
        </h1>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <select id="selRace" class="font-bold text-amber-300 py-2 px-3">
          <option value="C495">1ª Carrera (495) · 1100m · Gan. 3, 4 y 5</option>
          <option value="C500">6ª Carrera (500) · 1100m · IV Clásico Gaceta Hípica</option>
          <option value="C501">7ª Carrera (501) · 1800m · Gan. 3 y 4</option>
          <option value="C506">12ª Carrera (506) · 1100m · 5ª Válida 5y6</option>
        </select>
        <button id="btnSimWeights" type="button" class="px-3.5 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs uppercase cursor-pointer">
          ⚖️ Cargar Pesos En Vivo
        </button>
        <button id="btnRestoreAll" type="button" class="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-600 cursor-pointer">
          🔄 Restaurar Retirados y Previa
        </button>
      </div>
    </div>

    <!-- CONTROLES DE PISTA Y PARCIALES -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-xs bg-slate-900/90 p-3 rounded-xl border border-slate-800">
      <div>
        <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Factor de Pista</label>
        <select id="selPista" class="w-full text-amber-300 font-semibold">
          <option value="normal">Normal (0.0s)</option>
          <option value="ligera">Ligera / Rápida (-0.6s)</option>
          <option value="pesada">Pesada (+1.2s)</option>
        </select>
      </div>
      <div>
        <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Comportamiento Pista Hoy (En Vivo)</label>
        <select id="selLiveBias" class="w-full text-emerald-300 font-semibold">
          <option value="off">Sin Sesgo Adicional (Previa)</option>
          <option value="riel_interno">Ganan por Riel Interno (PP 1-3)</option>
          <option value="riel_externo">Riel Interno Pesado (Ganan 5+)</option>
          <option value="velocistas">Pista Favorece Velocistas (E1)</option>
          <option value="rematadores">Colapsan Punteros (Ganan E3)</option>
        </select>
      </div>
      <div>
        <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Parcial 400m (s)</label>
        <input id="in400" type="number" step="0.1" value="22.2" class="w-full mono font-bold text-amber-300" />
      </div>
      <div>
        <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Parcial 800m (s)</label>
        <input id="in800" type="number" step="0.1" value="45.3" class="w-full mono font-bold text-amber-300" />
      </div>
      <div>
        <label class="block text-[10px] uppercase text-slate-400 font-bold mb-1">Remate Final 200m (s)</label>
        <input id="inRem" type="number" step="0.1" value="12.3" class="w-full mono font-bold text-emerald-400" />
      </div>
    </div>

    <!-- PIZARRA Y SIMULACIÓN DE RECTA FINAL -->
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-6">
      
      <!-- PIZARRA LED -->
      <div class="xl:col-span-7 pizarra-led p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-800 pb-3">
          <div>
            <span id="mactorPaceState" class="text-[11px] font-extrabold uppercase tracking-wider text-amber-400 block"></span>
            <h2 id="raceTitle" class="text-base md:text-lg font-extrabold text-white"></h2>
          </div>
          <span id="activeCounter" class="text-xs mono bg-slate-900 px-3 py-1 rounded border border-slate-700 text-emerald-400 font-bold"></span>
        </div>

        <div id="pizarraList" class="space-y-2.5 max-h-[550px] overflow-y-auto pr-1"></div>
      </div>

      <!-- RECTA FINAL Y DICTAMEN -->
      <div class="xl:col-span-5 space-y-4">
        <div class="glass p-4">
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-sm font-bold text-white">Simulación Recta Final (Solo Ejemplares Activos)</h3>
            <span class="text-xs mono text-amber-400">Meta 🏁</span>
          </div>
          <div class="track-dirt p-3 space-y-2 min-h-[260px]">
            <div class="absolute right-8 top-0 bottom-0 w-2 bg-gradient-to-b from-white via-red-600 to-white z-10"></div>
            <div id="trackLanes" class="space-y-2 relative z-20 pr-10"></div>
          </div>
        </div>

        <div class="glass p-4 border border-amber-500/40 space-y-3">
          <span class="text-xs font-extrabold uppercase tracking-wider text-amber-400 block">
            Impacto Táctico de Retiros, Tren MACTOR y Jugadas Actualizadas
          </span>
          <div id="tacticalReport" class="text-xs text-slate-200 space-y-1.5 leading-relaxed"></div>
          <div id="ticketsBox" class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-800 text-xs"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const CLOTH = {
      1: { bg: '#DC2626', text: '#FFF', border: '#FCA5A5', name: 'Rojo' },
      2: { bg: '#F8FAFC', text: '#0F172A', border: '#94A3B8', name: 'Blanco' },

      5: { bg: '#15803D', text: '#FFF', border: '#86EFAC', name: 'Verde' },

    const DB = {

          { num: 2, name: "GOLDEN JE", ml: "10/1", jockey: "J. A. Rivero (55 Kg)", trainer: "R. Lanz", silk: "#2563EB", sr: 78, yunta: 14, style: "E3", early: 74, late: 85, wk: 9.0, optW: 419, liveW: null, simW: 419, retired: false },
          { num: 3, name: "EL PEQUEÑO JOSÉ", ml: "9/2", jockey: "Y. González (54.5 Kg)", trainer: "A. J. Rojas", silk: "#22C55E", sr: 76, yunta: 18, style: "E1", early: 91, late: 75, wk: 8.2, optW: 476, liveW: null, simW: 491, retired: false },
          { num: 4, name: "REY VULCANO", ml: "20/1", jockey: "L. Montilla (53 Kg)", trainer: "Ale. Pérez", silk: "#EAB308", sr: 55, yunta: 5, style: "E3", early: 62, late: 68, wk: 6.5, optW: 410, liveW: null, simW: 413, retired: false },
          { num: 5, name: "MIKETYSON", ml: "4/1", jockey: "F. Márquez (55.5 Kg)", trainer: "J. Sánchez", silk: "#DC2626", sr: 70, yunta: 20, style: "E2", early: 83, late: 82, wk: 8.3, optW: 465, liveW: null, simW: 465, retired: false },
          { num: 6, name: "APTITUD", ml: "6/1", jockey: "W. Véliz (54.5 Kg)", trainer: "J. Sánchez", silk: "#F59E0B", sr: 67, yunta: 22, style: "E1", early: 86, late: 77, wk: 8.1, optW: 438, liveW: null, simW: 448, retired: false },
          { num: 7, name: "TINTORERO", ml: "3/5", jockey: "F. González Jr. (54.5 Kg)", trainer: "F. Parilli Jr.", silk: "#FACC15", sr: 75, yunta: 35, style: "E1", early: 93, late: 86, wk: 9.1, optW: 495, liveW: null, simW: 484, retired: false },
          { num: 8, name: "ZARACEÑO", ml: "3/1", jockey: "J. Lugo Jr. (54.5 Kg)", trainer: "M. Viera", silk: "#9333EA", sr: 69, yunta: 60, style: "E2", early: 88, late: 87, wk: 9.0, optW: 451, liveW: null, simW: 451, retired: false }
        ]
      },
      "C500": {
        title: "6ª Carrera (500) — 1100m — IV Clásico Gaceta Hípica (GIII)",
        horses: [
          { num: 1, name: "LA GRAN SABANA", ml: "4/1", jockey: "W. Véliz (53 Kg)", trainer: "C. Doktorczyk", silk: "#38BDF8", sr: 68, yunta: 15, style: "E2", early: 82, late: 80, wk: 8.4, optW: 445, liveW: null, simW: 445, retired: false },
          { num: 2, name: "LATINA FINA", ml: "3/5", jockey: "I. Pimentel Jr. (53 Kg)", trainer: "H. Correia", silk: "#2DD4BF", sr: 67, yunta: 33, style: "E1", early: 90, late: 83, wk: 9.4, optW: 447, liveW: null, simW: 448, retired: false },
          { num: 3, name: "COLORADA (USA)", ml: "4/5", jockey: "J. A. Rivero (54 Kg)", trainer: "F. Parilli Jr.", silk: "#FACC15", sr: 73, yunta: 26, style: "E2", early: 88, late: 89, wk: 9.6, optW: 462, liveW: null, simW: 462, retired: false },
          { num: 4, name: "SEÑORA ISABEL (USA)", ml: "9/5", jockey: "H. Medina (54 Kg)", trainer: "L. Martínez", silk: "#F472B6", sr: 79, yunta: 22, style: "E1", early: 96, late: 88, wk: 9.2, optW: 460, liveW: null, simW: 459, retired: false },
          { num: 5, name: "GIULIANA MIA (USA)", ml: "6/5", jockey: "F. González Jr. (54 Kg)", trainer: "F. Parilli", silk: "#EF4444", sr: 72, yunta: 29, style: "E2", early: 86, late: 85, wk: 9.1, optW: 455, liveW: null, simW: 455, retired: false }
        ]
      },
      "C501": {
        title: "7ª Carrera (501) — 1800m — Ejemplares 4+ Gan. de 3 y 4",
        horses: [
          { num: 1, name: "FIRST TIME", ml: "20/1", jockey: "J. Aray (55 Kg)", trainer: "J. C. García M.", silk: "#3B82F6", sr: 78, yunta: 18, style: "E2", early: 80, late: 79, wk: 8.5, optW: 458, liveW: null, simW: 458, retired: false },
          { num: 3, name: "THE FIELDHER JR", ml: "15/1", jockey: "J. C. Rodríguez (55 Kg)", trainer: "J. D. Rivas", silk: "#CA8A04", sr: 81, yunta: 19, style: "E1", early: 89, late: 78, wk: 8.3, optW: 435, liveW: null, simW: 435, retired: false },
          { num: 4, name: "TIO HORACIO", ml: "9/2", jockey: "F. Quevedo (55 Kg)", trainer: "F. Parilli", silk: "#DC2626", sr: 71, yunta: 11, style: "E3", early: 76, late: 88, wk: 8.6, optW: 437, liveW: null, simW: 437, retired: false },
          { num: 5, name: "INVADER", ml: "5/1", jockey: "W. Véliz (55 Kg)", trainer: "G. Rojas", silk: "#2563EB", sr: 83, yunta: 16, style: "E3", early: 78, late: 91, wk: 9.2, optW: 472, liveW: null, simW: 471, retired: false },
          { num: 7, name: "FORREST GUMP", ml: "6/5", jockey: "H. Medina (53 Kg)", trainer: "J. Salvador", silk: "#1D4ED8", sr: 72, yunta: 28, style: "E1", early: 91, late: 87, wk: 8.8, optW: 425, liveW: null, simW: 425, retired: false },
          { num: 8, name: "ISOBÁRICO", ml: "2/1", jockey: "R. Capriles (53 Kg)", trainer: "J. C. García M.", silk: "#38BDF8", sr: 69, yunta: 25, style: "E2", early: 84, late: 86, wk: 8.9, optW: 491, liveW: null, simW: 490, retired: false }
        ]
      },
      "C506": {
        title: "12ª Carrera (506) — 1100m — 5ª Válida 5y6",
        horses: [
          { num: 1, name: "DRA BEA", ml: "7/2", jockey: "O. Medina (52 Kg)", trainer: "D. Guevara", silk: "#2563EB", sr: 66, yunta: 25, style: "E2", early: 84, late: 85, wk: 8.4, optW: 473, liveW: null, simW: 473, retired: false },
          { num: 5, name: "SPRING TRAINING", ml: "2/1", jockey: "R. Capriles (54.5 Kg)", trainer: "V. Di-Luca", silk: "#EA580C", sr: 68, yunta: 35, style: "E1", early: 88, late: 84, wk: 8.7, optW: 425, liveW: null, simW: 424, retired: false },
          { num: 7, name: "WAYA WAYA", ml: "3/1", jockey: "F. Márquez (53 Kg)", trainer: "A. Campos", silk: "#DC2626", sr: 76, yunta: 50, style: "E2", early: 87, late: 86, wk: 8.6, optW: 409, liveW: null, simW: 409, retired: false },
          { num: 8, name: "PRIORITISE", ml: "9/2", jockey: "S. Yanez (50 Kg)", trainer: "J. Romero R.", silk: "#EAB308", sr: 74, yunta: 25, style: "E1", early: 93, late: 82, wk: 8.5, optW: 449, liveW: null, simW: 449, retired: false },
          { num: 9, name: "PRINCESA SUSEJ", ml: "9/5", jockey: "J. Lugo (56 Kg)", trainer: "Jesse Romero", silk: "#1E40AF", sr: 81, yunta: 50, style: "E1", early: 92, late: 87, wk: 8.9, optW: 437, liveW: null, simW: 449, retired: false }
        ]
      }
    };

    let currentRace = "C495";

    function svgIcon(num, silk, size = 46) {
      const c = CLOTH[num] || { bg: '#334155', text: '#FFF', border: '#94A3B8' };
      return `
        <svg width="${size}" height="${Math.round(size * 0.78)}" viewBox="0 0 80 62" fill="none" class="shrink-0">
          <path d="M12 42 L6 54 M16 42 L15 56 M54 41 L61 55 M59 39 L69 51" stroke="#D97706" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M10 35 C10 26, 22 23, 35 23 L55 21 L67 10 L74 14 L67 24 L61 38 C52 42, 24 43, 10 35 Z" fill="#B45309" stroke="#F59E0B" stroke-width="1.2"/>
          <circle cx="46" cy="12" r="4.5" fill="${silk}" stroke="#FFF" stroke-width="1"/>
          <path d="M37 22 C39 14, 47 14, 51 21 Z" fill="${silk}" stroke="#FFF" stroke-width="1"/>
          <rect x="25" y="22" width="24" height="17" rx="3" fill="${c.bg}" stroke="${c.border}" stroke-width="1.8"/>
          <text x="37" y="34" text-anchor="middle" fill="${c.text}" font-family="monospace" font-weight="800" font-size="11">${num}</text>
        </svg>
      `;
    }

    window.toggleRetiro = function(num) {
      const race = DB[currentRace];
      const h = race.horses.find(x => x.num === num);
      if (h) {
        h.retired = !h.retired;
        renderBoard();
      }
    };

    window.updateWeight = function(num, val) {
      const race = DB[currentRace];
      const h = race.horses.find(x => x.num === num);
      if (h) {
        h.liveW = val === "" ? null : parseFloat(val);
        renderBoard();
      }
    };

    function renderBoard() {
      const race = DB[currentRace];
      const pista = document.getElementById('selPista').value;
      const liveBias = document.getElementById('selLiveBias').value;
      const s400 = parseFloat(document.getElementById('in400').value) || 22.2;

      const activeHorses = race.horses.filter(h => !h.retired);
      const retiredHorses = race.horses.filter(h => h.retired);

      // 1. Evaluar Tren de Carrera MACTOR según los Velocistas (E1) ACTIVOS
      const activeE1 = activeHorses.filter(h => h.style === 'E1');
      let paceStateText = "";
      let loneSpeedNum = null;

      if (activeE1.length >= 3 || s400 <= 21.8) {
        paceStateText = `🔥 TREN VIOLENTO MACTOR (${activeE1.length} velocistas E1 activos peleando la punta → Beneficia a E2/E3)`;
      } else if (activeE1.length === 1) {
        loneSpeedNum = activeE1[0].num;
        paceStateText = `🚀 PUNTERO SOLITARIO MACTOR: #${activeE1[0].num} ${activeE1[0].name} queda solo en punta sin pelea (+3.8 pts Godet)`;
      } else if (activeE1.length === 0) {
        paceStateText = `🐢 FALSO TREN MACTOR (Sin velocistas E1 activos → Los perseguidores E2 toman la iniciativa)`;
      } else {
        paceStateText = `⚖️ TREN EQUILIBRADO MACTOR (${activeE1.length} velocistas E1 activos)`;
      }

      document.getElementById('mactorPaceState').textContent = paceStateText;
      document.getElementById('raceTitle').textContent = race.title;
      document.getElementById('activeCounter').textContent = `Activos: ${activeHorses.length} | Retirados: ${retiredHorses.length}`;

      // 2. Calcular Score Prospectivo + Actuarial solo para Activos
      const scored = activeHorses.map(h => {
        let score = h.sr * 0.44 + h.yunta * 0.16 + h.wk * 1.4;

        if (activeE1.length >= 3 || s400 <= 21.8) {
          score += h.late * 0.26 + h.early * 0.09;
          if (h.style === 'E2' || h.style === 'E3') score += 3.2;
        } else if (loneSpeedNum === h.num) {
          score += h.early * 0.28 + h.late * 0.12 + 3.8; // Bono de Velocista Solitario por retiro de los otros E1
        } else {
          score += h.early * 0.18 + h.late * 0.18;
        }

        if (pista === 'ligera' && h.style === 'E1') score += 2.0;
        if (pista === 'pesada' && h.style === 'E3') score += 2.4;

        if (liveBias === 'riel_interno' && h.num <= 3) score += 2.2;
        if (liveBias === 'riel_externo' && h.num >= 5) score += 2.2;
        if (liveBias === 'velocistas' && h.style === 'E1') score += 2.5;
        if (liveBias === 'rematadores' && (h.style === 'E2' || h.style === 'E3')) score += 2.5;

        // Peso Físico en Vivo
        let weightBadge = `<span class="text-[10px] mono text-slate-400">Óptimo: ${h.optW} Kg</span>`;
        if (h.liveW !== null && !isNaN(h.liveW)) {
          const d = h.liveW - h.optW;
          if (Math.abs(d) <= 2.5) {
            score += 1.9;
            weightBadge = `<span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold mono">PESO ÓPTIMO (${h.liveW} Kg) +1.9</span>`;
          } else if (Math.abs(d) >= 7) {
            const pen = -Math.min(4.5, (Math.abs(d) - 5) * 0.55);
            score += pen;
            weightBadge = `<span class="px-2 py-0.5 rounded bg-rose-500/20 text-rose-300 text-[10px] font-bold mono">ALERTA PESO ${h.liveW} Kg (${pen.toFixed(1)})</span>`;
          } else {
            weightBadge = `<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold mono">Hoy: ${h.liveW} Kg (Δ ${d >= 0 ? '+' : ''}${d})</span>`;
          }
        }

        return { ...h, weightBadge, score: Number(score.toFixed(2)) };
      });

      scored.sort((a, b) => b.score - a.score);

      const maxS = scored.length ? scored[0].score : 70;
      const exps = scored.map(h => Math.exp((h.score - maxS) * 0.35));
      const sumE = exps.reduce((a, b) => a + b, 0) || 1;

      let accLen = 0;
      const rankedActive = scored.map((h, i) => {
        const prob = Number(((exps[i] / sumE) * 100).toFixed(1));
        if (i > 0) accLen += Math.max(0.25, Number(((scored[i - 1].score - h.score) * 0.72).toFixed(2)));
        return { ...h, rank: i + 1, prob, lenText: i === 0 ? "GANADOR" : `${accLen.toFixed(1)} cpos`, numLen: accLen };
      });

      // Renderizar filas activas + filas de retirados al final
      const listEl = document.getElementById('pizarraList');
      const lanesEl = document.getElementById('trackLanes');
      listEl.innerHTML = '';
      lanesEl.innerHTML = '';

      rankedActive.forEach((h, idx) => {
        const c = CLOTH[h.num] || { bg: '#334155', text: '#FFF', name: 'Gris' };
        listEl.innerHTML += `
          <div class="bg-slate-900/95 border ${idx === 0 ? 'border-amber-500' : 'border-slate-800'} rounded-xl p-3 flex flex-wrap md:flex-nowrap items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-20 text-center shrink-0">
                <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase ${idx === 0 ? 'bg-amber-400 text-slate-950' : idx === 1 ? 'bg-slate-200 text-slate-900' : 'bg-slate-800 text-slate-300'}">
                  ${idx + 1}° LUGAR
                </span>
                <span class="block text-[10px] mono text-slate-400 mt-1">${h.lenText}</span>
              </div>
              ${svgIcon(h.num, h.silk, 48)}
              <div class="min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="px-2 py-0.5 rounded text-xs font-extrabold mono" style="background:${c.bg}; color:${c.text}">#${h.num} ${c.name}</span>
                  <strong class="text-white text-sm md:text-base">${h.name}</strong>
                  <span class="text-xs mono text-amber-400">ML ${h.ml}</span>
                  <span class="px-1.5 py-0.5 rounded bg-slate-800 text-sky-300 text-[10px] mono font-bold">${h.style}</span>
                  ${h.weightBadge}
                </div>
                <p class="text-[11px] text-slate-400 mt-0.5">${h.jockey} · Ent: ${h.trainer} · SR: ${h.sr} · Yunta: ${h.yunta}%</p>
              </div>
            </div>

            <div class="flex items-center gap-2.5 shrink-0 ml-auto">
              <div>
                <label class="text-[9px] uppercase text-amber-300 font-bold block">Peso Hoy (Kg)</label>
                <input type="number" placeholder="${h.optW}" value="${h.liveW ?? ''}" oninput="window.updateWeight(${h.num}, this.value)" class="w-20 mono font-bold" />
              </div>
              <div class="text-right w-16">
                <span class="mono text-xs font-bold text-slate-300 block">${h.score}</span>
                <span class="mono text-sm font-extrabold text-emerald-400">${h.prob}%</span>
              </div>
              <button type="button" onclick="window.toggleRetiro(${h.num})" class="px-2.5 py-1.5 rounded-lg bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 border border-rose-500/40 text-[10px] font-extrabold uppercase cursor-pointer">
                🚫 Retirar
              </button>
            </div>
          </div>
        `;

        if (idx < 6) {
          const rightPct = Math.min(76, Math.round(h.numLen * 6.5));
          lanesEl.innerHTML += `
            <div class="relative h-9 bg-black/30 rounded-lg border border-amber-900/40 flex items-center px-2">
              <span class="text-[10px] mono text-amber-200/80 w-28 truncate">#${h.num} ${h.name}</span>
              <div class="flex-1 relative h-full flex items-center">
                <div class="absolute transition-all duration-300 flex items-center gap-1" style="right:${rightPct}%">
                  <span class="text-[9px] mono bg-slate-950 text-amber-300 px-1.5 py-0.5 rounded">${h.rank}° (${h.prob}%)</span>
                  ${svgIcon(h.num, h.silk, 34)}
                </div>
              </div>
            </div>
          `;
        }
      });

      // Mostrar los ejemplares retirados abajo con opción de Reactivar
      retiredHorses.forEach(h => {
        listEl.innerHTML += `
          <div class="bg-rose-950/20 border border-rose-800/50 opacity-75 rounded-xl p-2.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="px-2 py-0.5 rounded bg-rose-600 text-white text-[10px] font-extrabold uppercase mono">🚫 RETIRADO</span>
              <span class="line-through text-slate-400 font-bold text-sm">#${h.num} ${h.name} (${h.style})</span>
              <span class="text-xs text-rose-300">Excluido de la simulación y redistribuido su % SMIC</span>
            </div>
            <button type="button" onclick="window.toggleRetiro(${h.num})" class="px-3 py-1 rounded bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold cursor-pointer">
              ↩️ Reactivar Ejemplar
            </button>
          </div>
        `;
      });

      // Actualizar Reporte Táctico y Jugadas Recomendadas
      const t1 = rankedActive[0];
      const t2 = rankedActive[1] || t1;
      const t3 = rankedActive[2] || t2;

      const retiredNames = retiredHorses.map(r => `#${r.num} ${r.name} (${r.style})`).join(', ');
      document.getElementById('tacticalReport').innerHTML = `
        <p>${retiredHorses.length > 0
          ? `⚠️ <strong>Efecto de Retiros Activo:</strong> Al retirar a <strong>${retiredNames}</strong>, las probabilidades SMIC se redistribuyeron al 100\% entre los${activeHorses.length} ejemplares activos.`
          : `✓ Todos los ejemplares inscritos están activos. Haz clic en <strong>"🚫 Retirar"</strong> en cualquier caballo para ver cómo cambia el tren de carrera y la pizarra en vivo.`}</p>
        <p>🎯 <strong>Nueva Proyección Tope:</strong> <strong class="text-amber-400">#${t1.num} ${t1.name}</strong> (${t1.prob}% prob.) escoltado por <strong class="text-emerald-400">#${t2.num} ${t2.name}</strong> (${t2.prob}%).</p>
      `;

      document.getElementById('ticketsBox').innerHTML = `
        <div class="bg-slate-950 p-2 rounded border border-slate-800">
          <span class="text-[9px] uppercase text-slate-400 block">Ganador</span>
          <span class="mono font-extrabold text-amber-400">#${t1.num} ${t1.name}</span>
        </div>
        <div class="bg-slate-950 p-2 rounded border border-slate-800">
          <span class="text-[9px] uppercase text-slate-400 block">Exacta Sin Retirados</span>
          <span class="mono font-extrabold text-emerald-400">${t1.num} - ${t2.num}</span>
        </div>
        <div class="bg-slate-950 p-2 rounded border border-slate-800">
          <span class="text-[9px] uppercase text-slate-400 block">Trifecta Sin Retirados</span>
          <span class="mono font-extrabold text-sky-400">${t1.num} / ${t2.num} / ${t3.num}</span>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBoard();
      document.getElementById('selRace').addEventListener('change', e => { currentRace = e.target.value; renderBoard(); });
      ['selPista', 'selLiveBias', 'in400', 'in800', 'inRem'].forEach(id => {
        document.getElementById(id).addEventListener('change', renderBoard);
        document.getElementById(id).addEventListener('input', renderBoard);
      });
      document.getElementById('btnSimWeights').addEventListener('click', () => {
        DB[currentRace].horses.forEach(h => { h.liveW = h.simW; });
        renderBoard();
      });
      document.getElementById('btnRestoreAll').addEventListener('click', () => {
        DB[currentRace].horses.forEach(h => { h.retired = false; h.liveW = null; });
        document.getElementById('selLiveBias').value = 'off';
        renderBoard();
      });
    });
  </script>
</body>
</html>
