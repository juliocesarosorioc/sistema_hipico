<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollas y Remates - Club del Dinero</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>if (!localStorage.getItem('club_sesion_activa')) window.location.href = '../index.html';</script>
</head>
<body class="bg-indigo-50 font-sans text-sm h-screen flex overflow-hidden">

    <!-- El Sidebar se inyectará aquí automáticamente mediante layout.js -->

    <!-- ÁREA CENTRAL DE CONTENIDO -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden w-full">

        <!-- CABECERA -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0 z-10">
            <h1 class="text-xl font-black text-slate-800 uppercase tracking-wide">
                <i class="fas fa-trophy text-amber-500 mr-2"></i> Torneos y Pollas Hípicas
            </h1>
            <button id="btnAbrirModalPolla" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-bold shadow-md hover:bg-indigo-700 transition-transform hover:scale-105 text-xs uppercase tracking-wide">
                <i class="fas fa-plus mr-1"></i> Nueva Polla
            </button>
        </header>

        <main class="p-6 flex-1 overflow-y-auto max-w-7xl mx-auto w-full">
            
            <!-- TABLA DE POLLAS REGISTRADAS -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-slate-900 text-white p-3.5 font-bold text-xs uppercase tracking-wider flex items-center">
                    <i class="fas fa-clipboard-list mr-2 text-indigo-400"></i> Eventos Activos e Históricos
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-slate-100 text-slate-700 border-b border-slate-200 sticky top-0 shadow-sm z-10">
                            <tr>
                                <th class="p-3 font-bold uppercase tracking-wider">Nombre del Evento</th>
                                <th class="p-3 font-bold uppercase tracking-wider">Hipódromo</th>
                                <th class="p-3 font-bold uppercase tracking-wider">Fecha</th>
                                <th class="p-3 text-center font-bold uppercase tracking-wider">Tipo</th>
                                <th class="p-3 text-right font-bold uppercase tracking-wider text-emerald-600">Valor USD</th>
                                <th class="p-3 text-center font-bold uppercase tracking-wider">Carreras</th>
                                <th class="p-3 text-center font-bold uppercase tracking-wider">Jugadores</th>
                                <th class="p-3 text-right font-bold uppercase tracking-wider text-blue-600">Recaudado</th>
                                <th class="p-3 text-center font-bold uppercase tracking-wider">Estado</th>
                                <th class="p-3 text-center font-bold uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpoPollas" class="divide-y divide-slate-100 text-slate-700 bg-white">
                            <tr><td colspan="10" class="p-8 text-center text-slate-500 italic">Cargando pollas registradas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL: CREAR NUEVA POLLA -->
    <div id="modalNuevaPolla" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="bg-indigo-600 p-4 flex justify-between items-center text-white font-bold shrink-0 uppercase tracking-wide text-sm">
                <span><i class="fas fa-plus-circle mr-2"></i> Crear Nueva Polla</span>
                <button class="cerrar-modal text-indigo-200 hover:text-white transition-colors"><i class="fas fa-times text-lg"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="formNuevaPolla" class="space-y-5">
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Nombre de la Polla</label>
                        <input type="text" id="pollaNombre" placeholder="Ej: Polla Assiniboia Sábado" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 uppercase font-bold" required>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Hipódromo</label>
                        <select id="pollaHipodromo" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-bold text-slate-700" required>
                            <option value="">Cargando hipódromos...</option>
                        </select>
                    </div>

                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Fecha</label>
                            <input type="date" id="pollaFecha" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 font-bold" required>
                        </div>
                        <div class="w-1/3">
                            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">N° Carreras</label>
                            <input type="number" id="pollaCarreras" min="1" value="6" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 text-center font-bold" required>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Tipo de Polla</label>
                        <select id="pollaTipo" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-bold text-slate-700">
                            <option value="Paga">Bote Acumulado (Paga)</option>
                            <option value="Gratuita / Promocional">Gratuita / Promocional</option>
                        </select>
                    </div>

                    <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 shadow-inner">
                        <label class="block text-xs font-black text-indigo-900 mb-2 uppercase tracking-wider">Valor de la Inscripción (USD)</label>
                        <input type="number" id="pollaValor" step="0.01" value="0.00" class="w-full border border-indigo-300 rounded-lg px-3 py-3 text-xl outline-none focus:ring-2 focus:ring-indigo-500 font-mono font-black text-indigo-700 text-center shadow-sm" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider"><i class="fas fa-gift text-red-500 mr-1"></i> Incentivo (+USD)</label>
                            <input type="number" id="pollaIncentivo" step="0.01" value="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-center">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">House (% Comisión)</label>
                            <input type="number" id="pollaComision" step="0.01" value="20" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-center">
                        </div>
                    </div>

                </form>
            </div>
            
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-3 shrink-0">
                <button type="button" class="cerrar-modal bg-slate-300 text-slate-700 px-5 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-400 transition-colors uppercase tracking-wide">Cancelar</button>
                <button type="submit" form="formNuevaPolla" class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-xs font-bold shadow-md hover:bg-indigo-700 transition-transform hover:scale-105 uppercase tracking-wide flex items-center">
                    <i class="fas fa-check mr-2"></i> Crear Evento
                </button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/components/db.js"></script>
    <script src="../js/components/auth.js"></script>
    <script src="../js/components/ui.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/conexion.js"></script>
    <script src="../js/pollas.js"></script>
</body>
</html>
