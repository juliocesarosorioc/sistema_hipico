<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Bancos y Tesorería - Club del Dinero</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS Centralizado -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>if (!localStorage.getItem('club_sesion_activa')) window.location.href = '../index.html';</script>
</head>
<body class="bg-slate-50 font-sans text-sm h-screen flex overflow-hidden">

    <!-- El Sidebar se inyectará aquí automáticamente mediante layout.js -->

    <!-- ÁREA CENTRAL DE CONTENIDO -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden w-full">

        <!-- BARRA SUPERIOR DE CONTEXTO -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0 z-10">
            <h1 class="text-xl font-black text-slate-800 uppercase tracking-wide">
                <i class="fas fa-university text-blue-500 mr-2"></i> Tesorería y Cuentas Bancarias
            </h1>
            <div class="flex items-center gap-2 text-blue-700 font-bold text-xs bg-blue-50 border border-blue-200 px-4 py-1.5 rounded-full shadow-inner">
                <i class="fas fa-shield-alt"></i> Control de Liquidez Real
            </div>
        </header>

        <main class="p-6 flex-1 overflow-y-auto max-w-7xl mx-auto w-full space-y-6">
            
            <!-- FORMULARIO DE REGISTRO -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="text-sm font-bold text-slate-800 mb-4 border-b pb-2 flex items-center">
                    <i class="fas fa-plus-circle text-blue-400 mr-2"></i> Registrar Nueva Cuenta o Bóveda
                </div>
                <form id="formBanco" class="flex flex-wrap items-end gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Nombre de la Cuenta / Banco</label>
                        <input type="text" id="nombreBanco" placeholder="Ej: Zelle Empresa, Pago Móvil Banesco..." class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 uppercase transition-all" required>
                    </div>
                    
                    <div class="w-64">
                        <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Moneda Operativa</label>
                        <select id="monedaBanco" class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 font-bold text-slate-700 bg-slate-50 transition-all" required>
                            <option value="">Cargando monedas...</option>
                        </select>
                    </div>

                    <div class="w-48">
                        <label class="block text-xs font-bold text-slate-700 mb-1 uppercase tracking-wider">Saldo Inicial</label>
                        <div class="relative">
                            <input type="number" id="saldoInicial" step="0.01" value="0.00" class="w-full border border-slate-300 rounded-lg pl-3 pr-3 py-2.5 text-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 font-mono font-black text-right text-slate-800 transition-all" required>
                        </div>
                    </div>

                    <button type="submit" id="btnGuardarBanco" class="bg-slate-800 text-white px-6 py-2.5 rounded-lg shadow-md hover:bg-black font-bold transition-transform hover:scale-105 uppercase tracking-wide text-xs h-[46px]">
                        Añadir Banco
                    </button>
                </form>
            </div>

            <!-- TABLA DE BANCOS REGISTRADOS -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap justify-between items-center gap-4">
                    <h2 class="text-sm font-black text-slate-700 uppercase tracking-wide flex items-center">
                        <i class="fas fa-list mr-2 text-slate-400"></i> Directorio de Cuentas
                    </h2>
                    <div class="relative w-full md:w-80">
                        <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="text" id="buscadorBancos" placeholder="Buscar banco o moneda..." class="w-full border border-slate-300 rounded-lg pl-9 pr-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm transition-all">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-slate-900 text-white sticky top-0 z-10">
                            <tr>
                                <th class="p-3 font-semibold uppercase tracking-wider">Nombre Cuenta</th>
                                <th class="p-3 font-semibold uppercase tracking-wider">Moneda</th>
                                <th class="p-3 text-right font-semibold uppercase tracking-wider">Saldo Local</th>
                                <th class="p-3 text-right font-semibold uppercase tracking-wider">Tasa Actual</th>
                                <th class="p-3 text-right text-emerald-400 font-black uppercase tracking-wider">Equivalencia USD</th>
                                <th class="p-3 text-center font-semibold uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaBancos" class="divide-y divide-slate-200 bg-white text-slate-700">
                            <tr><td colspan="6" class="p-8 text-center text-slate-500 font-medium italic">Conectando a la base de datos...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- FOOTER TOTALES -->
                <div class="bg-slate-100 p-4 border-t border-slate-200 flex justify-between items-center">
                    <button id="btnEliminarTodos" class="border border-red-300 text-red-600 hover:bg-red-50 hover:text-red-700 font-bold px-4 py-2 rounded-lg text-xs transition-colors shadow-sm">
                        <i class="fas fa-trash-alt mr-1"></i> Borrar Todo el Directorio
                    </button>
                    <div class="text-right">
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Total Liquidez en Tesorería</p>
                        <p class="text-3xl font-black text-slate-800 font-mono" id="granTotalUSD">$0.00</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts y Componentes ajustados -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/components/db.js"></script>
    <script src="../js/components/auth.js"></script>
    <script src="../js/components/ui.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/conexion.js"></script>
    <script src="../js/bancos.js"></script>
</body>
</html>
