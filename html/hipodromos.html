<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Hipódromos - Club del Dinero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>if (!localStorage.getItem('club_sesion_activa')) window.location.href = '../index.html';</script>
</head>
<body class="bg-slate-50 font-sans text-sm h-screen flex overflow-hidden">

    <!-- El Sidebar se inyectará aquí automáticamente mediante layout.js -->

    <!-- ÁREA CENTRAL DE CONTENIDO -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden w-full">

        <!-- CABECERA -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0 z-10">
            <h1 class="text-xl font-black text-slate-800 uppercase tracking-wide">
                <i class="fas fa-horse-head text-purple-600 mr-2"></i> Catálogo de Hipódromos
            </h1>
            <div class="bg-purple-50 border border-purple-200 text-purple-800 px-4 py-1.5 rounded-full text-xs font-bold shadow-inner flex items-center">
                <i class="fas fa-map-marked-alt mr-2"></i> Base de Datos Global
            </div>
        </header>

        <main class="p-6 flex-1 overflow-y-auto max-w-5xl mx-auto w-full space-y-6">
            
            <!-- FORMULARIO DE REGISTRO RÁPIDO CON DATALIST -->
            <!-- Datalist inteligente con pistas frecuentes solicitadas -->
            <datalist id="listaPistas">
                <option value="La Rinconada (VEN)">
                <option value="Valencia (VEN)">
                <option value="Saratoga (USA)">
                <option value="Delaware Park (USA)">
                <option value="Churchill Downs (USA)">
                <option value="Gulfstream Park (USA)">
                <option value="Santa Anita (USA)">
            </datalist>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3"><i class="fas fa-plus-circle mr-1"></i> Añadir Nueva Pista</h2>
                <form id="formHipodromo" class="flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <input type="text" id="nombreHipodromo" list="listaPistas" placeholder="Seleccione de la lista o escriba un nombre..." class="w-full border border-slate-300 rounded-lg px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-purple-500 uppercase font-bold text-slate-800 shadow-sm" required autocomplete="off">
                    </div>
                    <button type="submit" class="bg-purple-600 text-white px-8 py-3 rounded-lg shadow-md hover:bg-purple-700 font-bold transition-transform hover:scale-105 uppercase tracking-wide text-xs">
                        Registrar
                    </button>
                </form>
            </div>

            <!-- LISTA DE HIPÓDROMOS Y BUSCADOR -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="p-4 bg-slate-900 border-b border-slate-800 flex flex-wrap justify-between items-center gap-4">
                    <h2 class="text-sm font-bold text-white uppercase tracking-wider">
                        Pistas Activas
                    </h2>
                    <div class="relative w-full md:w-80">
                        <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                        <input type="text" id="buscadorHipodromos" placeholder="Filtrar catálogo..." class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg pl-9 pr-4 py-2 text-sm outline-none focus:ring-1 focus:ring-purple-400 placeholder-slate-500 transition-colors">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-slate-100 text-slate-600 sticky top-0 shadow-sm">
                            <tr>
                                <th class="p-3 w-1/3 font-bold uppercase tracking-wider text-xs">Nombre de Pista ↕</th>
                                <th class="p-3 w-1/3 font-bold uppercase tracking-wider text-xs">Fecha Registro ↕</th>
                                <th class="p-3 text-center w-1/6 font-bold uppercase tracking-wider text-xs">Estado ↕</th>
                                <th class="p-3 text-center w-1/6 font-bold uppercase tracking-wider text-xs">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaHipodromos" class="divide-y divide-slate-100 text-slate-700 bg-white">
                            <tr><td colspan="4" class="p-8 text-center text-slate-500 italic">Conectando catálogo...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/components/db.js"></script>
    <script src="../js/components/auth.js"></script>
    <script src="../js/components/ui.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/conexion.js"></script>
    <script src="../js/hipodromos.js"></script>
</body>
</html>
