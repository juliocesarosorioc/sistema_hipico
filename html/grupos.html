<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos y Convenios - Club del Dinero</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>if (!localStorage.getItem('club_sesion_activa')) window.location.href = '../index.html';</script>
</head>
<body class="bg-slate-50 font-sans text-sm h-screen flex overflow-hidden">

    <!-- El Sidebar se inyectará aquí automáticamente mediante layout.js -->

    <!-- ÁREA CENTRAL DE CONTENIDO -->
    <div class="flex-1 flex flex-col h-full relative overflow-hidden w-full">

        <!-- CABECERA -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm shrink-0 z-10">
            <h1 class="text-xl font-bold text-slate-800 uppercase tracking-wide">
                <i class="fas fa-layer-group text-amber-500 mr-2"></i> Grupos de Venta y Convenios
            </h1>
            <button id="btnRecargarGrupos" class="bg-white border border-slate-300 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-50 shadow-sm transition-colors text-xs font-bold">
                <i class="fas fa-sync-alt mr-1"></i> Recargar
            </button>
        </header>

        <main class="p-6 flex-1 overflow-y-auto w-full">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 max-w-6xl mx-auto">

                <!-- Crear / Listar Grupos -->
                <div class="space-y-5">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-2 mb-4">
                            <i class="fas fa-plus-circle text-amber-500 mr-1"></i> Crear Grupo de Venta
                        </h3>
                        <form id="formGrupo" class="grid grid-cols-2 md:grid-cols-3 gap-3 items-end">
                            <div class="col-span-3">
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Nombre del Grupo</label>
                                <input type="text" id="nombreGrupo" placeholder="Ej: SUCURSAL COSTA" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase font-bold outline-none focus:ring-2 focus:ring-amber-500" required>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Moneda de Venta</label>
                                <select id="monedaGrupo" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
                                    <option value="USD">USD ($)</option>
                                    <option value="VES">VES (Bs)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Moneda de Cuadre</label>
                                <select id="monedaCuadreGrupo" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
                                    <option value="USD">USD ($)</option>
                                    <option value="VES">VES (Bs)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Cupos por Tabla</label>
                                <input type="number" id="cupoGrupo" value="100" min="1" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold text-center outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div class="col-span-3">
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Comisión por Tablas Fijas % <span class="text-amber-600">(convenio con el grupo)</span></label>
                                <input type="number" id="comisionGrupo" step="0.01" min="0" value="2.5" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm font-bold text-center outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div class="col-span-3">
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Responsable del Grupo</label>
                                <input type="text" id="responsableGrupo" placeholder="Nombre de la persona encargada" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase font-bold outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <div class="col-span-3">
                                <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Cuenta Bancaria para el Cuadre</label>
                                <input type="text" id="cuentaGrupo" placeholder="Banco / N° de cuenta" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase font-bold outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                            <label class="col-span-3 flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer">
                                <input type="checkbox" id="esPrincipalGrupo" class="rounded"> Es el grupo Principal (concentra la contabilidad)
                            </label>
                            <div class="col-span-3">
                                <button type="submit" id="btnGuardarGrupo" class="w-full bg-amber-500 text-slate-900 font-bold py-2.5 rounded-lg shadow hover:bg-amber-600 transition-colors text-xs uppercase tracking-wide">
                                    <i class="fas fa-plus-circle mr-2"></i> Crear Grupo y su Convenio
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-2 mb-2">
                            <i class="fas fa-list text-slate-400 mr-1"></i> Grupos Registrados
                        </h3>
                        <div id="listaGrupos" class="space-y-2 max-h-[26rem] overflow-y-auto pr-1">
                            <p class="text-slate-400 italic text-xs">Cargando grupos...</p>
                        </div>
                    </div>
                </div>

                <!-- Asignar Clientes -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 h-fit">
                    <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider border-b border-slate-200 pb-2 mb-4">
                        <i class="fas fa-user-tag text-slate-400 mr-1"></i> Asignar Clientes a Grupos
                    </h3>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Grupo Origen</label>
                            <select id="selectGrupoOrigen" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Grupo Destino</label>
                            <select id="selectGrupoDestino" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-xs font-bold text-slate-600 mb-2">
                        <span>Clientes del grupo origen:</span>
                        <span id="resumenClientesGrupo" class="text-amber-600">0</span>
                    </div>
                    <div id="listaClientesGrupo" class="space-y-1.5 max-h-72 overflow-y-auto border border-slate-200 rounded-lg p-2 bg-slate-50">
                        <p class="text-slate-400 italic text-xs">Seleccione un grupo origen.</p>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button id="btnMoverClientes" class="flex-1 bg-amber-500 text-slate-900 font-bold py-2 rounded-lg shadow hover:bg-amber-600 transition-colors text-xs uppercase tracking-wide">
                            <i class="fas fa-arrow-right mr-1"></i> Mover seleccionados
                        </button>
                        <button id="btnMoverTodos" class="flex-1 bg-slate-700 text-white font-bold py-2 rounded-lg shadow hover:bg-slate-800 transition-colors text-xs uppercase tracking-wide">
                            <i class="fas fa-forward mr-1"></i> Mover todos
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Editar Grupo -->
    <div id="modalEditarGrupo" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-800 p-4 text-white font-bold flex justify-between items-center text-sm uppercase">
                <span><i class="fas fa-edit mr-2"></i> Editar Grupo y Convenio</span>
                <button class="cerrar-modal text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="editGrupoId">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 uppercase">Nombre</label>
                    <input type="text" id="editGrupoNombre" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase font-bold outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase">Moneda Venta</label>
                        <select id="editGrupoMoneda" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
                            <option value="USD">USD</option>
                            <option value="VES">VES</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase">Moneda Cuadre</label>
                        <select id="editGrupoMonedaCuadre" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
                            <option value="USD">USD</option>
                            <option value="VES">VES</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase">Cupos/Tabla</label>
                        <input type="number" id="editGrupoCupo" min="1" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm font-bold text-center outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 uppercase">Comisión por Tablas Fijas %</label>
                    <input type="number" id="editGrupoComision" step="0.01" min="0" class="w-full border border-amber-300 rounded-lg px-3 py-2 text-sm font-bold text-center outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase">Responsable</label>
                    <input type="text" id="editGrupoResponsable" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase font-bold outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-600 mb-1 uppercase">Cuenta Bancaria (Cuadre)</label>
                    <input type="text" id="editGrupoCuenta" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase font-bold outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <label class="flex items-center gap-2 text-sm font-bold text-slate-700 cursor-pointer">
                    <input type="checkbox" id="editGrupoPrincipal" class="rounded"> Es el grupo Principal
                </label>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-3">
                <button type="button" class="cerrar-modal bg-slate-300 text-slate-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-400 transition-colors">Cancelar</button>
                <button type="button" id="btnGuardarGrupoEdit" class="bg-amber-500 text-slate-900 px-5 py-2 rounded-lg text-xs font-bold hover:bg-amber-600 shadow-md">Guardar Grupo</button>
            </div>
        </div>
    </div>

    <!-- Scripts y Componentes -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/components/db.js"></script>
    <script src="../js/components/auth.js"></script>
    <script src="../js/components/ui.js"></script>
    <script src="../js/components/layout.js"></script>
    <script src="../js/conexion.js"></script>
    <script src="../js/grupos.js"></script>
</body>
</html>
