<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Hipódromos - Club del Dinero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-sm h-screen flex flex-col overflow-x-hidden">

    <!-- NAVEGACIÓN SUPERIOR -->
    <header class="bg-white border-b border-slate-300 p-2 flex flex-wrap gap-2 items-center shadow-sm">
        <a href="dashboard.html" class="bg-slate-500 text-white px-3 py-1 rounded hover:bg-slate-600 transition shadow-sm">
            <i class="fas fa-arrow-left"></i> Volver
        </a>
        <a href="clientes.html" class="bg-cyan-500 text-white px-3 py-1 rounded shadow-sm hover:bg-cyan-600">Clientes</a>
        <a href="depositos.html" class="bg-emerald-600 text-white px-3 py-1 rounded shadow-sm hover:bg-emerald-700">Depósitos</a>
        <a href="retiros.html" class="bg-red-500 text-white px-3 py-1 rounded shadow-sm hover:bg-red-600">Retiros</a>
        <a href="transferencias.html" class="bg-amber-500 text-white px-3 py-1 rounded shadow-sm hover:bg-amber-600">Transferencias</a>
        <a href="taquilla.html" class="bg-blue-600 text-white px-3 py-1 rounded shadow-sm hover:bg-blue-700">Apuestas</a>
        <a href="saldos.html" class="bg-slate-800 text-white px-3 py-1 rounded shadow-sm hover:bg-slate-900">Saldos/Reportes</a>
    </header>

    <main class="p-6 flex-1 overflow-y-auto max-w-7xl mx-auto w-full">
        
        <!-- TÍTULO -->
        <h1 class="text-3xl font-bold text-slate-800 mb-6 flex items-center">
            <i class="fas fa-horse-head text-slate-700 mr-3"></i> Gestión de Hipódromos
        </h1>

        <!-- FORMULARIO DE REGISTRO RÁPIDO -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-8 flex flex-wrap gap-4 items-center">
            <form id="formHipodromo" class="flex w-full md:w-auto gap-4 flex-1">
                <input type="text" id="nombreHipodromo" placeholder="Nombre del hipódromo" class="flex-1 md:w-80 border border-slate-300 rounded px-4 py-2 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 uppercase" required>
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded shadow-sm hover:bg-blue-700 font-medium transition-colors flex items-center whitespace-nowrap">
                    <i class="fas fa-plus mr-2"></i> Agregar
                </button>
            </form>
        </div>

        <!-- LISTA DE HIPÓDROMOS Y BUSCADOR -->
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden mb-4">
            <div class="p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-4">
                <h2 class="text-xl font-bold text-slate-800 flex items-center">
                    <i class="fas fa-list-ul mr-2 text-slate-500"></i> Lista de Hipódromos
                </h2>
                <div class="relative w-full md:w-72">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-400"></i>
                    <input type="text" id="buscadorHipodromos" placeholder="Buscar hipódromo..." class="w-full border border-slate-300 rounded pl-9 pr-4 py-2 text-sm outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-900 text-white">
                        <tr>
                            <th class="p-3 w-1/3">Nombre ↕</th>
                            <th class="p-3 w-1/3">Fecha Creación ↕</th>
                            <th class="p-3 text-center w-1/6">Estado ↕</th>
                            <th class="p-3 text-center w-1/6">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaHipodromos" class="divide-y divide-slate-200">
                        <tr><td colspan="4" class="p-4 text-center text-slate-500">Cargando hipódromos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 1. Tecnología Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Puente de conexión -->
    <script src="js/conexion.js"></script>
    <!-- 3. Lógica del módulo -->
    <script src="js/hipodromos.js"></script>
</body>
</html>
